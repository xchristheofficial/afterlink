<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AfterLink — Connect After. Link Forever.</title>
    <meta
      name="description"
      content="Sign in to AfterLink, a product of Kodra."
    />
    <link
      rel="icon"
      href="/assets/favicon.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="layout">
      <aside
        class="art"
        aria-label="Decorative feed illustration from the AfterLink design reference, not live user activity"
      >
        <img
          src="/assets/auth-illustration.webp"
          alt=""
          width="1119"
          height="1120"
        />
      </aside>
      <section class="card" aria-label="AfterLink account access">
        <div class="inside" data-mode="signin">
          <header>
            <h1>
              <img
                src="/assets/auth-brand.webp"
                width="810"
                height="209"
                alt="AfterLink — Connect After. Link Forever."
              />
            </h1>
          </header>
          <div id="auth">
            <h2 id="heading" tabindex="-1">Sign In</h2>
            <form id="form" aria-labelledby="heading">
              <div class="field" data-registration hidden>
                <label for="fullName">Full Name</label
                ><input
                  id="fullName"
                  autocomplete="name"
                  maxlength="100"
                  placeholder="Enter your full name"
                  required
                  disabled
                />
              </div>
              <div class="field" data-registration hidden>
                <label for="username">Username</label
                ><input
                  id="username"
                  autocomplete="username"
                  minlength="3"
                  maxlength="30"
                  pattern="[A-Za-z0-9_]{3,30}"
                  title="3–30 letters, numbers, or underscores"
                  placeholder="Choose a username"
                  required
                  disabled
                />
              </div>
              <div class="field">
                <label for="email">Email</label
                ><input
                  id="email"
                  type="email"
                  autocomplete="email"
                  maxlength="254"
                  placeholder="you@example.com"
                  required
                />
              </div>
              <div class="field">
                <label for="password">Password</label>
                <div class="password-wrap">
                  <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="128"
                    placeholder="••••••••••••"
                    required
                  /><button
                    type="button"
                    id="reveal"
                    aria-label="Show password"
                    aria-pressed="false"
                  >
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path
                        fill="currentColor"
                        d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Zm11 4.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0-2a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"
                      />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="field" data-registration hidden>
                <label for="phone">Phone (optional)</label
                ><input
                  id="phone"
                  type="tel"
                  autocomplete="tel"
                  maxlength="32"
                  placeholder="+1 (555) 000-0000"
                  disabled
                />
              </div>
              <button class="link forgot" id="forgot" type="button">
                Forgot password?
              </button>
              <p role="alert" id="error" hidden></p>
              <button class="primary" id="submit">Sign In</button>
            </form>
            <div class="divider">or</div>
            <button class="google" id="google">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15z"
                />
                <path
                  fill="#34A853"
                  d="M24 44c5.5 0 10.1-1.8 13.6-4.9L31 34c-1.8 1.2-4.1 1.9-7 1.9-5.3 0-9.8-3.6-11.4-8.4H5.7v5.3A20.5 20.5 0 0 0 24 44z"
                />
                <path
                  fill="#FBBC05"
                  d="M12.6 27.5a12 12 0 0 1 0-7.2V15H5.7a20 20 0 0 0 0 17.8z"
                />
                <path
                  fill="#EA4335"
                  d="M24 12c3 0 5.6 1 7.6 3l5.8-5.8C34 6 29.5 4 24 4A20.5 20.5 0 0 0 5.7 15l6.9 5.3C14.2 15.5 18.7 12 24 12z"
                /></svg
              >Continue with Google
            </button>
            <p class="switch">
              <span id="switchPrompt">Don’t have an account?</span>
              <button type="button" class="link" id="switchMode">
                Sign up
              </button>
            </p>
          </div>
          <section id="account" hidden>
            <span class="eyebrow">AFTERLINK ACCOUNT</span>
            <h2>You're signed in.</h2>
            <p id="accountEmail"></p>
            <button class="primary" id="logout">Sign out</button>
            <footer>
              <nav aria-label="Information">
                <button data-info="Privacy">Privacy</button
                ><i aria-hidden="true">·</i
                ><button data-info="Terms">Terms</button
                ><i aria-hidden="true">·</i
                ><button data-info="Help">Help</button
                ><i aria-hidden="true">·</i
                ><button data-info="More">More</button>
              </nav>
              <small
                >By continuing you agree to AfterLink's
                <button data-info="Terms">Terms</button> &amp;
                <button data-info="Privacy">Privacy Policy</button>.</small
              >
            </footer>
          </section>
        </div>
      </section>
    </main>
    <dialog
      id="dialog"
      aria-labelledby="dialogTitle"
      aria-describedby="dialogText"
    >
      <span class="eyebrow">AFTERLINK · KODRA</span>
      <h2 id="dialogTitle"></h2>
      <p id="dialogText"></p>
      <form method="dialog"><button class="primary">Close</button></form>
    </dialog>
  </body>
</html>
