<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AfterLink</title>
    <link rel="icon" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/theme.css" />
    <script defer src="/navigation.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/composer.css" />
    <link rel="stylesheet" href="/social.css" />
    <script defer src="/composer.js"></script>
    <script type="module" src="/social.js"></script>
    <link rel="stylesheet" href="/preferences.css" />
    <link rel="stylesheet" href="/notes.css" />
    <link rel="stylesheet" href="/linkbacks.css" />
    <link rel="stylesheet" href="/chat-media.css" />
    <script src="/appearance.js"></script>
  </head>
  <body class="social">
    <header id="socialBar">
      <a href="/home" class="member-brand" aria-label="AfterLink home"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <use href="/assets/icons.svg#brand-link" /></svg
        >AfterLink</a
      >
      <form action="/search" role="search" id="socialSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <use href="/assets/icons.svg#search" /></svg
        ><input type="search" name="q" aria-label="Search" maxlength="100" />
      </form>
      <nav aria-label="Main navigation" id="socialNav"></nav>
    </header>
    <p id="alert" hidden role="alert"></p>
    <p class="social-loading" role="status">Loading page…</p>
    <main id="surface" aria-busy="true"></main>
    <dialog id="socialDialog">
      <button type="button" id="dismiss" aria-label="Close">×</button>
      <div id="sheet"></div>
    </dialog>
  </body>
</html>
