# Free plan: no disk is available, so durability comes from Postgres.
# DATABASE_URL is sync:false - paste the Supabase connection string into the
# Render dashboard instead of committing it. For a paid service with a disk,
# see docs/sqlite-release.md.
services:
  - type: web
    name: afterlink
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_FILE
        value: /tmp/afterlink.sqlite
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.3
